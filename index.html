<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ 박난이 방 공식 댓글 생성기 ✨</title>
  
  <!-- Google Fonts: Outfit (for numbers/English) & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="glass-background"></div>
  <div class="particles" id="particles"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="glass-panel">
      <h1>✨ 박난이 방 공식 댓글 생성기 ✨</h1>
      <p class="subtitle">마음에 드는 멘트를 클릭해서 채팅창에 복사하세요!</p>
      <a href="https://www.youtube.com/@%EB%B0%95%EB%82%9C%EC%9D%B4-d5n" target="_blank" rel="noopener noreferrer" class="youtube-btn">
        ▶️ 공식 유튜브 채널 가기
      </a>
    </header>

    <!-- Main Content -->
    <main>
      <div class="stats-container">
        <span class="stat-badge">누적 복사: <strong id="copy-count">0</strong>회</span>
      </div>
      <!-- AI Polish Section -->
      <section class="ai-polish-section">
        <div class="section-header">
          <h2>✨ AI 채팅 다듬기</h2>
        </div>
        <div class="ai-input-container">
          <textarea id="ai-input" placeholder="여기에 하고 싶은 말을 대충 적어보세요!&#10;예) 오늘 방송 너무 재밌다" rows="3"></textarea>
          <div class="ai-button-group" style="display: flex; gap: 10px;">
            <button id="ai-submit-btn" class="glow-btn" style="flex: 1;">
              <span>🪄 예쁘게 다듬기</span>
            </button>
            <button id="ai-tease-btn" class="glow-btn" style="flex: 1; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); color: #333;">
              <span>😜 놀리기 (팩폭)</span>
            </button>
          </div>
        </div>
        <div id="ai-loading" class="hidden">
          <div class="spinner"></div>
          <p>AI가 감성을 듬뿍 담아 다듬는 중...</p>
        </div>
        <div id="ai-result-container" class="card-container"></div>
      </section>

      <!-- Enter Section -->
      <section class="category-section" data-category="Enter">
        <div class="section-header">
          <h2>🚪 1. 입장 및 인사</h2>
          <button class="glow-btn small-btn shuffle-section-btn">
            <span>🎲 셔플</span>
          </button>
        </div>
        <div class="card-container"></div>
      </section>

      <!-- Drink Section -->
      <section class="category-section" data-category="Drink">
        <div class="section-header">
          <h2>🍻 2. 음주 및 안주 소통</h2>
          <button class="glow-btn small-btn shuffle-section-btn">
            <span>🎲 셔플</span>
          </button>
        </div>
        <div class="card-container"></div>
      </section>

      <!-- Music Section -->
      <section class="category-section" data-category="Music">
        <div class="section-header">
          <h2>📻 3. 음악 감상 및 신청곡</h2>
          <button class="glow-btn small-btn shuffle-section-btn">
            <span>🎲 셔플</span>
          </button>
        </div>
        <div class="card-container"></div>
      </section>

      <!-- Banter Section -->
      <section class="category-section" data-category="Banter">
        <div class="section-header">
          <h2>💬 4. 티키타카 및 공감 소통</h2>
          <button class="glow-btn small-btn shuffle-section-btn">
            <span>🎲 셔플</span>
          </button>
        </div>
        <div class="card-container"></div>
      </section>

      <!-- Exit Section -->
      <section class="category-section" data-category="Exit">
        <div class="section-header">
          <h2>💤 5. 퇴장 및 마무리</h2>
          <button class="glow-btn small-btn shuffle-section-btn">
            <span>🎲 셔플</span>
          </button>
        </div>
        <div class="card-container"></div>
      </section>

      <!-- Dance Section (Restored) -->
      <section class="category-section" data-category="Dance">
        <div class="section-header">
          <h2>💃 6. 신나는 댄스곡 반응</h2>
          <button class="glow-btn small-btn shuffle-section-btn">
            <span>🎲 셔플</span>
          </button>
        </div>
        <div class="card-container"></div>
      </section>

      <!-- Quiz Section (New) -->
      <section class="category-section" data-category="Quiz">
        <div class="section-header">
          <h2>🤔 이모티콘 속담 퀴즈</h2>
          <button class="glow-btn small-btn shuffle-section-btn">
            <span>🎲 셔플</span>
          </button>
        </div>
        <div class="card-container"></div>
      </section>

      <section class="category-section" data-category="SongQuiz">
        <div class="section-header">
          <h2>🎵 이모티콘 노래제목 퀴즈</h2>
          <button class="glow-btn small-btn shuffle-section-btn">
            <span>🎲 셔플</span>
          </button>
        </div>
        <div class="card-container"></div>
      </section>

    </main>

    <!-- Footer -->
    <footer>
      <p>박난이 님을 응원하는 시청자를 위한 팬메이드 툴입니다. 💖</p>
    </footer>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/clipboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
